name: smartbox_trade
description: A new Flutter project for Home Inventory and Marketplace.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0

  # Image & Camera
  image_picker: ^1.0.7
  camera: ^0.10.5+9

  # ML & Utils
  google_ml_kit_image_labeling: ^0.11.0
  qr_flutter: ^4.1.0

  # State Management & Utilities (Standard additions for good architecture)
  equatable: ^2.0.5 # For value equality in models
  uuid: ^4.3.3 # For generating IDs locally

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
